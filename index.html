  --bg: #0f172a;
  --panel: #1e293b;
  --panel2: #334155;
  --text: #f8fafc;
  --muted: #94a3b8;

[data-theme="roxo"] {

  --panel2: #f3e8ff;
  --text: #1e1b4b;

  --header-bg: rgba(255,255,255,.96);
}

[data-theme="azul-original"] {
  color-scheme: light;
  --bg: #f4f7fb;
  --panel: #ffffff;
  --panel2: #eaf1ff;
  --text: #172033;
  --muted: #64748b;
  --accent: #2563eb;
  --accent-soft: #eff6ff;

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;transition:background .2s,color .2s}
header{position:sticky;top:0;z-index:5;background:var(--header-bg);backdrop-filter:blur(12px);padding:16px;box-shadow:0 1px 0 var(--line)}.brand{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand-info{display:flex;align-items:center;gap:12px}.brandmark{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#60a5fa);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 5px 12px rgba(37,99,235,.2)}
h1{font-size:19px;letter-spacing:-.35px;margin:0 0 3px;font-weight:800}header p{margin:0;color:var(--muted);font-size:12px}.wrap{padding:16px 14px 28px;max-width:900px;margin:auto}

.theme-switcher{display:flex;gap:6px;align-items:center;background:var(--panel2);padding:4px 8px;border-radius:999px;border:1px solid var(--line)}
.theme-dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.theme-dot:active{transform:scale(.9)}
.theme-dot.active{border-color:var(--text);transform:scale(1.1)}
.dot-dark{background:#0f172a}
.dot-verde{background:#047857}
.dot-roxo{background:#7c3aed}
.dot-azul{background:#2563eb}

.search{width:100%;min-width:0;padding:14px 15px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;outline:none;box-shadow:0 2px 5px #0f172a05}.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.3)}.filters{display:flex;gap:7px;margin-top:10px}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700}.filter.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.songlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:60vh;overflow:auto;padding:1px 2px 3px}.song{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;text-align:left;padding:13px 14px;font-size:14px;box-shadow:0 2px 6px #0f172a04;transition:border-color .15s,transform .15s}.song:active{transform:scale(.995)}.song.active{border-color:var(--accent);background:var(--panel2)}.songnum{display:grid;place-items:center;flex:0 0 34px;height:34px;border-radius:11px;background:var(--panel2);color:var(--accent);font-weight:800;font-size:12px}.songinfo{min-width:0;flex:1}.songtitle{font-weight:750;line-height:1.35;overflow-wrap:anywhere;text-transform:uppercase}.song small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.star{border:0;background:transparent;color:#94a3b8;font-size:22px;line-height:1;padding:4px}.star.fav{color:#f59e0b}
.viewer{position:fixed;top:68px;bottom:0;left:0;right:0;width:100%;max-width:900px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:4}.songhead{flex:0 0 auto;padding:12px;border-bottom:1px solid var(--line);background:var(--panel2);text-align:center}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.songhead h2{font-size:18px;line-height:1.2;letter-spacing:-.3px;margin:8px 0 6px;color:var(--text);text-align:center}.key{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--panel);color:var(--accent);padding:6px 12px;font-weight:800;font-size:13px;border:1px solid var(--line);margin:0 auto}
button.action{border:0;border-radius:12px;padding:13px 10px;background:var(--accent);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 10px rgba(0,0,0,.15)}button.action:active{transform:translateY(1px)}button.secondary{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:none}.controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:8px;border-bottom:1px solid var(--line);background:var(--panel2)}.controls button{min-height:40px;padding:9px 6px;font-size:13px}.status{display:none!important}.lyrics{flex:1 1 auto;min-height:0;max-height:none;padding:12px 12px 18px;overflow:auto;overscroll-behavior:contain;background:var(--panel)}.line{font:15px/1.75 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:calc(15px * var(--lyric-zoom,1));white-space:pre;letter-spacing:.5px;min-height:1.75em;width:max-content;min-width:100%;color:var(--text)}.line.chords{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--chord);font-weight:800;position:relative;white-space:pre;height:1.75em;min-width:0}.chord-token{position:absolute;top:0;white-space:pre;color:var(--chord);font-weight:850}.lyric-searchbar{padding:12px 14px 0;background:var(--panel)}.lyric-search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--text);font-size:14px;outline:none}.match-count{display:none!important}.empty{padding:24px 16px;color:var(--muted);text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:14px;margin-top:12px}.foot{font-size:11px;color:var(--muted);padding:14px 5px;text-align:center;line-height:1.5}#back{padding:8px 12px;font-size:13px}.hide{display:none!important}.viewer.focus-lyrics{top:0;left:0;right:0;bottom:0;max-width:none;border:0;border-radius:0;z-index:20}.viewer.focus-lyrics .songhead,.viewer.focus-lyrics .controls{display:none!important}.viewer.focus-lyrics .focus-keybar{display:flex}.viewer.focus-lyrics .action-bar{display:flex;gap:8px;margin-top:10px}
.add-song-btn{flex:2;border-radius:14px!important;}
.import-btn{flex:1;background:var(--panel2)!important;color:var(--text)!important;border:1px solid var(--line)!important;border-radius:14px!important;padding:13px 10px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 5px #0f172a05;transition:filter .15s}
.import-btn:active{filter:brightness(0.9)}

.head-actions{display:flex;align-items:center;gap:6px}.icon-btn{padding:7px 10px!important;font-size:15px!important;line-height:1;display:inline-flex;align-items:center;justify-content:center;border-radius:10px!important}.song-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}.song-modal-card{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:620px;max-height:92dvh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}.song-modal-card h2{margin:0 0 16px;font-size:20px;text-align:center}.song-modal-card label{display:block;font-weight:750;font-size:13px;margin:12px 0 6px}.song-modal-card textarea{width:100%;min-height:42vh;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--text);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre;tab-size:4}.modal-help{font-size:12px;color:var(--muted);white-space:pre-line;margin:5px 0}.modal-buttons{display:flex;gap:8px;margin-top:12px}.modal-buttons button{flex:1}.song-modal.hide{display:none!important}

/* Estilos da Importação em Lote */
.batch-preview{max-height:220px;overflow-y:auto;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:13px}

.batch-item:last-child{border-bottom:none}

#editToggle.editing{background:var(--accent);color:#fff}

<header>
  <div class="brand">
    <div class="brand-info">
      <div class="brandmark">♫</div>
      <div><h1>Louvores ICNV — Coletânea 2027</h1></div>
    </div>
    <div class="theme-switcher">
      <div class="theme-dot dot-dark active" onclick="setTheme('dark')" title="Escuro (Palco)"></div>
      <div class="theme-dot dot-verde" onclick="setTheme('verde')" title="Verde Oliva"></div>
      <div class="theme-dot dot-roxo" onclick="setTheme('roxo')" title="Roxo & Vinho"></div>
      <div class="theme-dot dot-azul" onclick="setTheme('azul-original')" title="Azul Original"></div>
    </div>
  </div>
</header>
<div class="wrap">
  <input class="search" id="search" placeholder="⌕  Buscar louvor" autocomplete="off" aria-label="Buscar louvor pelo nome ou palavra da letra">
  
  <div class="action-bar">
    <button class="action add-song-btn" id="addSong">＋ Adicionar louvor</button>
    <label class="action import-btn" title="Importar arquivo Word com 1 louvor por página">
      📄 Importar .docx
      <input type="file" id="docxInput" accept=".docx" style="display:none">
    </label>
  </div>

  <div id="catalog">
    <div class="filters">
      <button class="filter active" id="allFilter">Todos os louvores</button>
      <button class="filter" id="favFilter">★ Favoritos</button>
    </div>
    <div class="songlist" id="songlist"></div>
  </div>
  <section class="viewer hide" id="viewer">
    <div class="songhead">
      <div class="toprow">
        <button class="action secondary" id="back">← Lista</button>
        <div class="head-actions">
          <button class="action secondary icon-btn" id="editSong" title="Editar cadastro">✏️</button>
          <button class="action secondary icon-btn" id="deleteSong" title="Excluir louvor">🗑️</button>
          <button class="star" id="songFav" aria-label="Adicionar aos favoritos">☆</button>
        </div>
      </div>
      <h2 id="title"></h2>
      <div class="key" id="key"></div>
    </div>
    <div class="focus-keybar" id="focusKeybar">
      <div class="focus-key-label">
        <span class="focus-song-title" id="focusSongTitle">Nome do louvor</span>
        <span class="focus-key-value" id="focusKey">Tom: —</span>
      </div>
      <button type="button" id="editToggle" aria-pressed="false">✏️ Editar</button>
      <button type="button" id="focusZoomOut" aria-label="Diminuir tamanho da cifra">A−</button>
      <button type="button" id="focusZoomIn" aria-label="Aumentar tamanho da cifra">A+</button>
      <button type="button" id="focusDown" aria-label="Baixar meio tom">− Tom</button>
      <button type="button" id="focusReset" aria-label="Voltar ao tom original">↺ Tom</button>
      <button type="button" id="focusUp" aria-label="Subir meio tom">+ Tom</button>
    </div>
    <div class="controls">
      <button class="action" id="down">− Meio tom</button>
      <button class="action" id="up">+ Meio tom</button>
      <button class="action secondary" id="reset">↺ Tom original</button>
      <button class="action secondary" id="copy">▣ Copiar cifra</button>
    </div>
    <div class="status hide" id="status" aria-hidden="true"></div>
    <div class="lyrics" id="lyrics"></div>
  </section>
</div>

<!-- Modal Edição / Adição Manual -->
<div class="song-modal hide" id="songModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="song-modal-card">
    <h2 id="modalTitle">Adicionar louvor</h2>
    <label for="songName">Nome do louvor</label>
    <input id="songName" class="search" maxlength="180" placeholder="Digite o título">
    <label for="songLyrics">Letra e cifras</label>
    <p class="modal-help">Digite as cifras em linhas próprias, acima da letra, mantendo os espaços.</p>
    <textarea id="songLyrics" spellcheck="false" placeholder="Cole ou digite a letra e as cifras aqui"></textarea>
    <div class="modal-buttons">
      <button class="action secondary" id="cancelSong">Cancelar</button>
      <button class="action" id="saveSong">Salvar louvor</button>
    </div>
  </div>
</div>

<!-- Modal Confirmação de Importação em Lote -->
<div class="song-modal hide" id="batchModal" role="dialog" aria-modal="true">
  <div class="song-modal-card">
    <h2>Importar Louvores do Word</h2>
    <p id="batchSummary" style="font-size:14px; color:var(--muted); margin-bottom:10px;"></p>
    <div class="batch-preview" id="batchList"></div>
    <div class="modal-buttons">
      <button class="action secondary" id="cancelBatch">Cancelar</button>
      <button class="action" id="confirmBatch">Confirmar e Cadastrar Todos</button>
    </div>
  </div>
</div>

<script>

  document.documentElement.setAttribute('data-theme', name);
  document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));

  if(activeDot) activeDot.classList.add('active');
  try{ localStorage.setItem('icnv_theme', name); }catch(e){}
}
(function(){
  const saved = localStorage.getItem('icnv_theme') || 'dark';
  setTheme(saved);

function persistCatalog(){try{localStorage.setItem('icnv_catalog_v1',JSON.stringify(songs));return true;}catch(e){alert('Não foi possível salvar.');return false;}}

const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
let selected=null, shift=0;
const $=id=>document.getElementById(id);
function rootIndex(n){const map={'C':0,'B#':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'Fb':4,'E#':5,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11};return map[n]??-1}
function transNote(note,steps){let i=rootIndex(note);if(i<0)return note;return NOTES[((i+steps)%12+12)%12]}
function chordToken(tok){let clean=tok.replace(/^[([{]+|[)\]},;]+$/g,''); if(!clean)return null;
 let m=clean.match(/^([A-G](?:#|b)?)(.*)$/); if(!m)return null;
 let rest=m[2];
 if(rest.includes('/')){let parts=rest.split('/');if(parts.length===2 && /^[A-G](?:#|b)?$/.test(parts[1])){rest=parts[0]+'/'+parts[1]}else if(parts.length>2)return null;}
 const suffix=rest.split('/')[0];
 if(!/^(?:|m|M|maj|maj7|maj9|mmaj7|m7|m9|m6|m7b5|dim|dim7|aug|aug7|sus|sus2|sus4|add2|add4|add9|5|6|7|9|11|13|4|7M|7\(4\)|7\(9\)|9\)|º|°|o|#?\d+|\d+M|\d+\(\d+\)|m\(\d+\)|7b9|7#9|7sus4|7sus2|madd9|6\/9|7\/\d+|\(.*\))*$/i.test(suffix))return null;
 return {clean,root:m[1],rest};
}
function transposeToken(tok,steps){let prefix=(tok.match(/^[([{]+/)||[''])[0], suffix=(tok.match(/[)\]},;]+$/)||[''])[0];let core=tok.slice(prefix.length,tok.length-suffix.length);let c=chordToken(core);if(!c)return tok;
 let rest=c.rest;
 let slash=rest.match(/^(.*)\/([A-G](?:#|b)?)$/);
 if(slash) rest=slash[1]+'/'+transNote(slash[2],steps);
 return prefix+transNote(c.root,steps)+rest+suffix;
}
function looksLikeChordLine(line){let s=line.trim();if(!s)return false;
 if(/^Tom\s*:/i.test(s))return true;
 if(/^Notas\s*:/i.test(s))return false;
 let cleaned=s.replace(/\[(?:Intro|Refrão|Refr[aã]o|Primeira Parte|Segunda Parte|Pré-Refrão|Final|Ponte|Instrumental|Repetir[^\]]*)\]/ig,' ').replace(/\b(?:Intro|Final)\b/ig,' ').replace(/\d+ª?\s*VEZ:?/ig,' ').replace(/\b(?:BACK|Notas):?/ig,' ').replace(/[()\[\]{}|,:;.!–—-]/g,' ');
 let toks=cleaned.split(/\s+/).filter(Boolean); if(!toks.length)return false;
 let chordCount=toks.filter(t=>!!chordToken(t)).length;
 return chordCount>0 && (chordCount===toks.length || chordCount>=2 && chordCount/toks.length>=0.45);
}
function transLine(line,steps){
 if(/^\s*Tom\s*:/i.test(line)) return line.replace(/(Tom\s*:\s*)([A-G](?:#|b)?m?)/i,(all,prefix,n)=>prefix+transposeKeyName(n,steps));
 if(!looksLikeChordLine(line))return line;
 return line.replace(/(?<![A-Za-zÀ-ÿ0-9])([A-G](?:#|b)?(?:maj7|maj9|mmaj7|m7b5|m7|m9|m6|madd9|dim7|dim|aug7|sus2|sus4|sus|add9|add2|add4|7sus4|7sus2|7b9|7#9|7M|13|11|9|7|6|5|4|M|m|º|°|o)?(?:\([^\s)]*\))?(?:\/[A-G](?:#|b)?)?)(?![A-Za-zÀ-ÿ0-9])/g,(tok)=>transposeToken(tok,steps));
}
function transposeKeyName(k,steps){let m=k.match(/^([A-G](?:#|b)?)(m?)$/i);if(!m)return k;return transNote(m[1],steps)+m[2]}
function currentLines(){return selected.lines.map(l=>transLine(l,shift))}
function keyFromLines(lines){for(let l of lines){let m=l.match(/^\s*Tom\s*:\s*([A-G](?:#|b)?m?)/i);if(m)return m[1]}return 'Tom não informado'}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

 const style=getComputedStyle(div);
 const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');ctx.font=`${style.fontSize} ${style.fontFamily}`;
 const measure=(txt)=>ctx.measureText(txt).width + txt.length*0.5;
 div.style.width=`${Math.max(measure(originalLine),1)}px`;div.style.minWidth=`${Math.max(measure(originalLine),1)}px`;
 let previousRight=0; const minGap=17;
 tokens.forEach(m=>{
 const chord=transposeToken(m[0],step);
 const wanted=measure(originalLine.slice(0,m.index));
 const x=Math.max(wanted, previousRight+minGap);
 const span=document.createElement('span');span.className='chord-token';span.style.left=`${x}px`;span.textContent=chord;div.appendChild(span);
 previousRight=x+ctx.measureText(chord).width+2;
 div.style.width=`${Math.max(parseFloat(div.style.width)||0,previousRight)}px`;
 div.style.minWidth=div.style.width;
 });
 if(!tokens.length)div.textContent=' ';
 return div;
}

// IMPORTAÇÃO MULTI-PÁGINAS DO WORD (.DOCX)
let parsedBatchSongs = [];

$('docxInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const arrayBuffer = event.target.result;
    
    mammoth.convertToHtml({ arrayBuffer: arrayBuffer })
      .then(function(result) {
        const html = result.value;
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;

        let pageTexts = [];
        let currentPage = [];

        tempDiv.childNodes.forEach(node => {
          const isPageBreak = node.outerHTML && (
            node.outerHTML.includes('page-break') || 
            node.outerHTML.includes('break-before') ||
            node.style?.pageBreakBefore === 'always'
          );

          if (isPageBreak && currentPage.length > 0) {
            pageTexts.push(currentPage.join('\n').trim());
            currentPage = [];
          } else {
            const text = node.textContent || '';
            if (text.trim()) currentPage.push(text);
          }
        });

        if (currentPage.length > 0) {
          pageTexts.push(currentPage.join('\n').trim());
        }

        if (pageTexts.length === 1) {
          pageTexts = pageTexts[0].split(/\n\s*\n\s*\n/).filter(p => p.trim());
        }

        parsedBatchSongs = [];
        pageTexts.forEach(pageContent => {
          const lines = pageContent.split('\n').map(l => l.trimEnd()).filter(l => l !== '');
          if (lines.length > 0) {
            const title = lines[0].trim();
            const songLines = lines.slice(1);
            if (title) {
              parsedBatchSongs.push({
                title: title.toLocaleUpperCase('pt-BR'),
                lines: songLines.length > 0 ? songLines : [title]
              });
            }
          }
        });

        if (parsedBatchSongs.length === 0) {
          alert('Nenhum louvor foi identificado no arquivo.');
          return;
        }

        $('batchSummary').textContent = `${parsedBatchSongs.length} louvor(es) encontrado(s) no arquivo Word:`;
        const listDiv = $('batchList');
        listDiv.innerHTML = '';
        parsedBatchSongs.forEach((s, idx) => {
          const item = document.createElement('div');
          item.className = 'batch-item';
          item.innerHTML = `<span><strong>${idx + 1}.</strong> ${esc(s.title)}</span><small style="color:var(--muted)">${s.lines.length} linhas</small>`;
          listDiv.appendChild(item);
        });

        $('batchModal').classList.remove('hide');
        $('docxInput').value = '';
      })
      .catch(function(err) {
        alert('Erro ao ler o arquivo Word: ' + err.message);
      });
  };
  reader.readAsArrayBuffer(file);
});

$('cancelBatch').addEventListener('click', () => {
  $('batchModal').classList.add('hide');
  parsedBatchSongs = [];
});

$('confirmBatch').addEventListener('click', () => {
  if (parsedBatchSongs.length === 0) return;

  parsedBatchSongs.forEach(s => {
    const id = songs.reduce((m, item) => Math.max(m, Number(item.id) || 0), -1) + 1;
    const number = songs.reduce((m, item) => Math.max(m, Number(item.number) || 0), 0) + 1;
    songs.push({
      id,
      number,
      title: s.title,
      lines: s.lines
    });
  });

  if (persistCatalog()) {
    renderCatalog();
    $('batchModal').classList.add('hide');
    alert(`${parsedBatchSongs.length} louvores cadastrados com sucesso!`);
    parsedBatchSongs = [];
  }
});

$('saveSong').addEventListener('click',()=>{const title=$('songName').value.trim();const body=$('songLyrics').value.replace(/\r/g,'').trim();if(!title){alert('Digite o nome.');return;}if(!body){alert('Digite a letra.');return;}const lines=body.split('\n');if(editingSongId!==null){const i=songs.findIndex(s=>s.id===editingSongId);if(i>=0)songs[i]={...songs[i],title:title.toLocaleUpperCase('pt-BR'),lines};if(selected&&selected.id===editingSongId)selected=songs[i];}else{const id=songs.reduce((m,s)=>Math.max(m,Number(s.id)||0),-1)+1;const number=songs.reduce((m,s)=>Math.max(m,Number(s.number)||0),0)+1;songs.push({id,number,title:title.toLocaleUpperCase('pt-BR'),lines});}if(!persistCatalog())return;closeSongForm();renderCatalog();if(selected&&!$('viewer').classList.contains('hide')){const index=songs.findIndex(s=>s.id===selected.id);if(index>=0){selected=songs[index];renderSong();}}alert('Salvo com sucesso!');});

$('deleteSong').addEventListener('click',()=>{if(!selected)return;if(!confirm('Excluir o louvor “'+selected.title+'”?'))return;songs=songs.filter(s=>s.id!==selected.id);favorites.delete(selected.id);saveFavorites();persistCatalog();selected=null;$('viewer').classList.add('hide');$('catalog').classList.remove('hide');renderCatalog();});
$('songModal').addEventListener('click',e=>{if(e.target===$('songModal'))closeSongForm();});
function renderSong(){let lines=currentLines();$('key').textContent=keyFromLines(lines);$('focusSongTitle').textContent=selected.title;$('focusKey').textContent=keyFromLines(lines).replace(/^Tom\s*:/i,'Tom:');let root=$('lyrics');root.style.setProperty('--lyric-zoom',lyricZoom);root.innerHTML='';let previousWasBlank=false;selected.lines.forEach((original,i)=>{const isBlank=!String(original).trim();if(isBlank&&previousWasBlank)return;previousWasBlank=isBlank;let line=lines[i]??original;let div;if(looksLikeChordLine(original)&&!/^\s*Tom\s*:/i.test(original)){div=renderAlignedChordLine(original,shift)}else{div=document.createElement('div');div.className='line';div.textContent=line||' ';}root.appendChild(div)});};

let touchStartX = 0, touchStartY = 0;
$('viewer').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

$('viewer').addEventListener('touchend', e => {
  let touchEndX = e.changedTouches[0].screenX;
  let touchEndY = e.changedTouches[0].screenY;
  let diffX = touchEndX - touchStartX;
  let diffY = Math.abs(touchEndY - touchStartY);
  if (diffX > 80 && diffY < 60) {
    $('viewer').classList.remove('focus-lyrics');
    $('viewer').classList.add('hide');
    $('catalog').classList.remove('hide');
    renderCatalog();
  }
}, {passive: true});

$('search').addEventListener('input',()=>{if(!$('viewer').classList.contains('hide')){$('viewer').classList.add('hide');$('catalog').classList.remove('hide')}selected=null;renderCatalog()});$('allFilter').onclick=()=>{showFavorites=false;renderCatalog()};$('favFilter').onclick=()=>{showFavorites=true;renderCatalog()};$('songFav').onclick=()=>{if(selected)toggleFavorite(selected.id)};$('up').onclick=()=>{shift++;renderSong()};$('down').onclick=()=>{shift--;renderSong()};$('reset').onclick=()=>{shift=0;renderSong()};$('back').onclick=()=>{$('viewer').classList.add('hide');$('catalog').classList.remove('hide');renderCatalog()};$('copy').onclick=()=>{let text=$('title').textContent+'\n'+currentLines().join('\n');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(()=>{})}else{let ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove()}};
renderCatalog();
